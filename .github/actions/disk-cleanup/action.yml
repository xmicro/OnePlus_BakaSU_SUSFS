name: 'Disk Cleanup'

inputs:
  debug:
    description: 'Enable Logs'
    required: false
    type: boolean
    default: false

runs:
  using: 'composite'
  steps:
    - name: Disk Cleanup by Deleting files
      shell: bash
      run: |
        echo "::group::Disk Cleanup by Deleting files"

        # Ubuntu 26.04 mounts /tmp as tmpfs. Stage on the runner's disk instead.
        TRASH_DIR="${RUNNER_TEMP:?}/.background_trash"
        mkdir -p "$TRASH_DIR"/{1..18}

        safe_mv() {
          if [ -e "$1" ]; then
            sudo mv "$1" "$2"
          fi
        }
        export -f safe_mv

        safe_mv /usr/share/dotnet "$TRASH_DIR/1" &
        safe_mv /usr/local/lib/android "$TRASH_DIR/2" &
        safe_mv /opt/ghc "$TRASH_DIR/3" &
        safe_mv /opt/hostedtoolcache/CodeQL "$TRASH_DIR/4" &
        safe_mv /usr/local/aws-sam-cli "$TRASH_DIR/5" &
        safe_mv /usr/local/share/chromium "$TRASH_DIR/6" &
        safe_mv /usr/local/share/powershell "$TRASH_DIR/7" &
        safe_mv /usr/local/lib/heroku "$TRASH_DIR/8" &
        safe_mv /usr/local/lib/node_modules "$TRASH_DIR/9" &
        safe_mv /opt/az "$TRASH_DIR/10" &
        safe_mv /opt/microsoft/powershell "$TRASH_DIR/11" &
        safe_mv /opt/hostedtoolcache/go "$TRASH_DIR/12" &
        safe_mv /opt/hostedtoolcache/PyPy "$TRASH_DIR/13" &
        safe_mv /opt/hostedtoolcache/node "$TRASH_DIR/14" &

        sudo bash -c 'mv /usr/local/bin/aliyun /usr/local/bin/azcopy /usr/local/bin/bicep /usr/local/bin/cmake-gui /usr/local/bin/cpack /usr/local/bin/helm \
        /usr/local/bin/hub /usr/local/bin/kubectl /usr/local/bin/minikube /usr/local/bin/node /usr/local/bin/packer /usr/local/bin/sam \
        /usr/local/bin/stack /usr/local/bin/terraform /usr/local/bin/oc "$1" 2>/dev/null || true' _ "$TRASH_DIR/15" &

        sudo bash -c 'mv /usr/local/julia* "$1" 2>/dev/null || true' _ "$TRASH_DIR/16" &
        sudo bash -c 'mv /usr/local/bin/pulumi* "$1" 2>/dev/null || true' _ "$TRASH_DIR/17" &
        wait

        echo "Relocation complete. Removing staged files..."
        sudo chattr -R -i -a "$TRASH_DIR" 2>/dev/null || true
        sudo nice -n 19 ionice -c 3 rm -rf -- "$TRASH_DIR"

        if command -v docker >/dev/null 2>&1; then
          docker images -q | xargs -r docker rmi 2>/dev/null || true
        fi

        echo "Running APT cleanup synchronously..."
        sudo env DEBIAN_FRONTEND=noninteractive apt-get purge -y \
          firefox google-chrome-stable microsoft-edge-stable \
          > /dev/null 2>&1 || true

        sudo env DEBIAN_FRONTEND=noninteractive apt-get autoremove -y \
          > /dev/null 2>&1 || true

        sudo apt-get clean
        echo "APT cleanup finished."
        echo "::endgroup::"
